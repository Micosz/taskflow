name: Build desktop release
on:
  push:
    tags: ['v1.*']
env:
  RELEASE_VERSION: ${{ github.ref_name }}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version
        run: python -c "import json,os; assert 'v'+json.load(open('package.json'))['version']==os.environ['RELEASE_VERSION']"
      - name: Prepare public app configuration
        run: python -c "import shutil; shutil.copy2('desktop/release/public-settings.json', 'desktop/release/public-config.json')"
      - run: python -m pip install pyinstaller==6.16.0
      - name: Test shared bridge
        run: python -m unittest discover -s desktop/kde-widget -p 'test_*.py' -v
      - name: Set Windows product version
        run: python desktop/release/build_release.py --windows-version-file windows-version.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name TaskFlowWidget --version-file windows-version.txt --paths desktop/kde-widget --add-data "desktop/release/public-config.json;." desktop/release/portable.py
      - name: Smoke test and package
        shell: pwsh
        run: |
          $proc = Start-Process dist/TaskFlowWidget.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw 'Widget smoke test timed out' }
          if ($proc.ExitCode -ne 0) { throw 'Widget smoke test failed' }
          Copy-Item desktop/release/Install.cmd,desktop/release/Uninstall.cmd dist/
          Copy-Item desktop/release/RELEASE-README.md dist/README.md
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $archive = "TaskFlow-Widgets-$version-Windows-x64.zip"
          Compress-Archive -Path dist/TaskFlowWidget.exe,dist/Install.cmd,dist/Uninstall.cmd,dist/README.md -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii SHA256SUMS-Windows.txt
      - name: Upload Windows files to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          gh release upload $env:RELEASE_VERSION "TaskFlow-Widgets-$version-Windows-x64.zip" SHA256SUMS-Windows.txt --clobber
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk smoke test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Verify release version
        run: python -c "import json,os; assert 'v'+json.load(open('package.json'))['version']==os.environ['RELEASE_VERSION']"
      - name: Prepare public app configuration
        run: python -c "import shutil; shutil.copy2('desktop/release/public-settings.json', 'desktop/release/public-config.json')"
      - name: Test shared bridge and packaging
        run: python -m unittest discover -s desktop/kde-widget -p 'test_*.py' -v
      - name: Test release contracts
        run: python -m unittest discover -s desktop/release -p 'test_*.py' -v
      - name: Smoke test portable windows
        run: xvfb-run -a python desktop/release/portable.py --smoke-test
